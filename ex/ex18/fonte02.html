<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('latenza.otf');
            font-size: 3em;
            font-weight: normal;
            /* tipos de formatos
             format(opentyoe)
            - opentyoe (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-att (apple advanced typography)
            svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
        
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis fugiat atque nobis. Aperiam, nisi! Esse a expedita distinctio, pariatur minima recusandae, facilis tenetur asperiores, suscipit dolorum ea voluptatem unde voluptates?</p>
    
</body>
</html>
