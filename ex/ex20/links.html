<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando links</title>
    <style>
        /*
        SELETORES PERSONALIZADOS
        #  = id
        .  = class
        :  = pseudoclass
        :: = pseudo-element
        >  = clildren  
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        a {
            color: black;
            text-decoration: none; /*tirar sublimhado de links*/
            font-weight: bold; /*negrito*/
        }
        a:visited /*pseudoclasse*/{
            color: rgb(131, 6, 6);
        }
        a:hover {
            text-decoration: underline;
            color: black;
        }
        a:active {
            color: yellow;
        }
        a::after {
            content: '[link]';
            color: rgb(184, 72, 72);
            font-weight: normal;
            text-decoration: none;
        }

    </style>

</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>   
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositorio</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" target="_blank">Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank">Site</a></li>
    </ul>
    
</body>
</html>
